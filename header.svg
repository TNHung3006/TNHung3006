<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Ngọc Hùng" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fd3ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 78px; text-anchor: middle; }
      .sub { font-size: 18px; font-weight: 500; fill: #9ccfe8; letter-spacing: 2px; }
      .float { animation: float 4s ease-in-out infinite; }
      .fade { animation: fade 1.6s ease-out both; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>

  <g class="float fade">
    <!-- Lớp bóng đổ tạo độ sâu 3D -->
    <text x="459" y="117" fill="rgb(10,40,70)">Ngọc Hùng</text>
    <text x="458" y="116" fill="rgb(10,46,76)">Ngọc Hùng</text>
    <text x="457" y="115" fill="rgb(10,52,82)">Ngọc Hùng</text>
    <text x="456" y="114" fill="rgb(10,58,88)">Ngọc Hùng</text>
    <text x="455" y="113" fill="rgb(10,64,94)">Ngọc Hùng</text>
    <text x="454" y="112" fill="rgb(10,70,100)">Ngọc Hùng</text>
    <text x="453" y="111" fill="rgb(10,76,106)">Ngọc Hùng</text>
    <text x="452" y="110" fill="rgb(10,82,112)">Ngọc Hùng</text>
    <text x="451" y="109" fill="rgb(10,88,118)">Ngọc Hùng</text>
    
    <!-- Mặt chữ phía trước -->
    <text x="450" y="108" fill="url(#face)" filter="url(#glow)">Ngọc Hùng</text>
  </g>

  <text class="sub fade" x="450" y="170" style="font-size:18px;font-weight:500">SOFTWARE ENGINEERING STUDENT  •  QA / TESTER  &amp;  FULLSTACK DEV</text>
</svg>